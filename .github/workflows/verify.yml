name: verify
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: sh tools/bootstrap.sh
      - env:
          SDF_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p artifacts/core
          set -o pipefail
          python3 tools/verify.py 2>&1 | tee artifacts/core/verify.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: core-evidence
          path: |
            artifacts/core/evidence.json
            artifacts/core/coverage.json
            artifacts/core/coverage.lcov
            artifacts/core/tests.log
            artifacts/core/verify.log
