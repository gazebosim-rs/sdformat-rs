[package]
name = "sdformat"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Independent validated SDFormat semantic model"

[dependencies]
petgraph = "=0.8.1"
quick-xml = "=0.38.3"
xmlparser = "=0.13.6"
glam = { version = "=0.30.9", default-features = false, features = ["std"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "=0.2.191"
errno = "=0.3.14"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"

[dev-dependencies]
serde_json = "=1.0.150"
tempfile = "=3.27.0"
syn = { version = "=3.0.9", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
